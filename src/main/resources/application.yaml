server:
  port: 8081

spring:
  application:
    name: finman-identity
  datasource:
    url: jdbc:mysql://localhost:3306/finman_identity
    username: finman_identity
    password: ${DB_PASSWORD:mysql}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          lob:
            non-contextual-creation: true
  output:
    ansi:
      enabled: Always

security:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:keys/identity-private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/identity-public.pem}
    issuer: ${JWT_ISSUER:finman-identity}
    audience: ${JWT_AUDIENCE:finman-api}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

app:
  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:5173}