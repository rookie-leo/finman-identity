server:
  port: 8081

spring:
  application:
    name: finman-identity
  datasource:
    url: jdbc:mysql://localhost:3306/finman_identity
    username: finman_identity
    password: ${DB_PASSWORD:mysql}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          lob:
            non-contextual-creation: true
  output:
    ansi:
      enabled: Always

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

app:
  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:5173}