server:
  port: 8081

spring:
  application:
    name: blog-pessoa-service
  datasource:
    url: jdbc:mysql://localhost:3306/blog-pessoas
    username: blog-pessoas
    password: mysql
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          lob:
            non-contextual-creation: true
  output:
    ansi:
      enabled: Always

