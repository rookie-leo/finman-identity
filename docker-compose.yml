name: finman-identity

services:
  mysql:
    image: mysql:8.0
    container_name: finman-identity-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: finman_identity
      MYSQL_USER: finman_identity
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - finman_identity_mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d

    command: --default-authentication-plugin=mysql_native_password

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
    ports:
      - "8080:80"

  adminer:
    image: adminer
    ports:
      - "8082:8080"

volumes:
  finman_identity_mysql_data: